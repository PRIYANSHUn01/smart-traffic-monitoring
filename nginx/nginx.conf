# nginx/nginx.conf — TLS reverse proxy for Traffic Monitoring System
# LOW-3 FIX: all traffic is served over HTTPS; plain HTTP redirects to HTTPS.
#
# ── Quick-start (self-signed cert for local testing) ──────────────────────────
#   mkdir -p nginx/ssl
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem \
#     -subj "/CN=localhost"
#
# ── Production (Let's Encrypt via Certbot) ────────────────────────────────────
#   certbot certonly --standalone -d yourdomain.com
#   # then mount /etc/letsencrypt into the nginx container (see docker-compose.yml)
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # ── Security headers (applied to all responses) ───────────────────────────
    add_header X-Frame-Options            DENY                               always;
    add_header X-Content-Type-Options     nosniff                            always;
    add_header X-XSS-Protection           "1; mode=block"                    always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy         "geolocation=(), camera=()"        always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # Hide nginx version from error pages and Server header
    server_tokens off;

    # ── Per-IP rate limiting (backup layer on top of FastAPI slowapi) ─────────
    limit_req_zone $binary_remote_addr zone=api_zone:10m       rate=30r/m;
    limit_req_zone $binary_remote_addr zone=dashboard_zone:10m rate=60r/m;

    # ── TLS shared settings ───────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── HTTP → HTTPS redirect (catches both API and dashboard) ────────────────
    server {
        listen      80;
        server_name _;
        return 301  https://$host$request_uri;
    }

    # ── REST API (port 443, path /api/) ───────────────────────────────────────
    server {
        listen      443 ssl;
        server_name api.yourdomain.com;   # ← replace with your actual domain

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Reject oversized request bodies (limits payload-based DoS)
        client_max_body_size 1m;

        location / {
            limit_req zone=api_zone burst=15 nodelay;

            proxy_pass              http://api:8000;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            # Strip the X-API-Key from upstream responses to avoid leakage
            proxy_hide_header       X-API-Key;

            # Timeouts
            proxy_connect_timeout   10s;
            proxy_send_timeout      30s;
            proxy_read_timeout      30s;
        }
    }

    # ── Streamlit Dashboard (port 443, separate subdomain) ───────────────────
    server {
        listen      443 ssl;
        server_name dashboard.yourdomain.com;  # ← replace with your actual domain

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        client_max_body_size 5m;   # allow slightly larger uploads (snapshot images)

        location / {
            limit_req zone=dashboard_zone burst=30 nodelay;

            proxy_pass              http://dashboard:8501;
            proxy_http_version      1.1;

            # Streamlit uses WebSockets for live updates
            proxy_set_header        Upgrade           $http_upgrade;
            proxy_set_header        Connection        "upgrade";

            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            # Keep WebSocket connections alive for the auto-refresh loop
            proxy_read_timeout      86400;
        }
    }
}
